name: Daily job radar

on:
  schedule:
    - cron: '19,29,49 * * * *'
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-job-radar
  cancel-in-progress: false

jobs:
  build:
    name: Build job radar
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "ddgs==9.16.0"

      - name: Check required files
        shell: bash
        run: |
          set -e
          test -f collector.py
          test -f multi_source.py
          test -f config.json
          test -f web/template.html
          test -f tests/test_rules.py
          mkdir -p data site

      - name: Check Python syntax
        run: |
          python -m py_compile collector.py multi_source.py

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

      - name: Search sources and generate website
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python multi_source.py

      - name: Check generated website
        shell: bash
        run: |
          set -e
          test -s site/index.html
          test -s site/jobs.json
          python -m json.tool site/jobs.json > /dev/null

      - name: Save job history
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to job history."
          else
            git commit -m "Update job history"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish website
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
